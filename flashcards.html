<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AWS Flashcards</title>
<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --text: #1b1f24; --muted: #5b6470;
    --border: #d9dde3; --accent: #c45a00; --accent-text: #ffffff;
    --good: #1f7a3d; --again: #a33a2a; --code-bg: #eef0f3;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171b; --surface: #1d2127; --text: #e7eaee; --muted: #9aa3ae;
      --border: #333a43; --accent: #ff9a3d; --accent-text: #1b1f24;
      --good: #5cc584; --again: #f08a7a; --code-bg: #2a3038;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-bottom: 16px; }
  select, button { font: inherit; color: inherit; }
  select {
    flex: 1 1 280px; min-width: 0; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface);
  }
  label.check { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
  .card {
    display: block; width: 100%; min-height: 280px; padding: 28px; text-align: left; cursor: pointer;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: 0 1px 3px rgb(0 0 0 / .06);
    transition: transform .18s ease;
  }
  .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .card.flipping { transform: rotateX(90deg); }
  .side { font-size: .75rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  .q { font-size: 1.25rem; font-weight: 600; margin: 8px 0 0; }
  .card.show-answer .q { font-size: 1rem; color: var(--muted); font-weight: 500; }
  .a { margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--border); }
  .hint { margin-top: 24px; color: var(--muted); font-size: .875rem; }
  code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; font-size: .9em; }
  .meta { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 10px 2px; color: var(--muted); font-size: .875rem; }
  .meta a { color: var(--accent); }
  .controls { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 8px; }
  .controls button, .toolbar button {
    padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); cursor: pointer;
  }
  .controls button:hover, .toolbar button:hover { border-color: var(--accent); }
  .controls .primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .controls .good { color: var(--good); }
  .controls .again { color: var(--again); }
  .empty { padding: 40px 0; text-align: center; color: var(--muted); }
  kbd { font: .8em ui-monospace, monospace; border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
  @media (max-width: 520px) {
    .controls { grid-template-columns: repeat(2, 1fr); }
    .controls .primary { grid-column: span 2; order: -1; }
  }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>AWS Flashcards</h1>
  <p class="sub">Review cards built from my lesson notes. Pick a deck, flip, and mark what you know.</p>

  <div class="toolbar">
    <select id="deck" aria-label="Choose a deck"></select>
    <button id="shuffle" type="button" aria-pressed="false">Shuffle</button>
    <label class="check"><input id="hideKnown" type="checkbox"> Hide known</label>
  </div>

  <div id="stage"></div>

  <p class="hint">Keys: <kbd>Space</kbd> flip · <kbd>←</kbd> <kbd>→</kbd> prev/next · <kbd>1</kbd> again · <kbd>2</kbd> got it ·
    <button id="reset" type="button" style="border:0;background:none;color:inherit;text-decoration:underline;cursor:pointer;padding:0">reset progress</button></p>
</main>

<script>
// Deck files: one per lesson, stored next to the lesson note. Add a line here for each new deck.
const DECK_FILES = [
  '02-iam/quiz-01-iam-fundamentals.cards.js',
  '02-iam/lesson-01-cloud-security-with-iam.cards.js',
];

window.DECKS = [];
const $ = (id) => document.getElementById(id);
const store = {
  get() { try { return JSON.parse(localStorage.getItem('aws-flashcards-known')) || {}; } catch { return {}; } },
  set(v) { try { localStorage.setItem('aws-flashcards-known', JSON.stringify(v)); } catch {} },
};
let known = store.get();
let order = [], pos = 0, flipped = false, shuffled = false;

function load(src) {
  return new Promise((resolve) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = () => { console.warn('Could not load deck', src); resolve(); };
    document.head.appendChild(s);
  });
}

// Card text is plain text: `code`, **bold** and line breaks are supported.
function fmt(text) {
  const esc = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  return esc.replace(/`([^`]+)`/g, '<code>$1</code>')
            .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
            .replace(/\n/g, '<br>');
}

function allCards() {
  return DECKS.flatMap((d, di) => d.cards.map(([q, a], ci) => ({ q, a, deck: d, id: d.notes + '#' + ci })));
}

function selected() {
  const v = $('deck').value;
  const cards = v === 'all' ? allCards() : allCards().filter((c) => c.deck.notes === v);
  return $('hideKnown').checked ? cards.filter((c) => !known[c.id]) : cards;
}

function rebuild() {
  order = selected();
  if (shuffled) {
    for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  }
  pos = 0; flipped = false; render();
}

function render() {
  const stage = $('stage');
  if (!order.length) {
    stage.innerHTML = `<div class="empty">${DECKS.length ? 'No cards left. Untick “Hide known” or reset progress. 🎉' : 'No decks loaded.'}</div>`;
    return;
  }
  const c = order[pos];
  const total = selected().length, knownCount = allCards().filter((x) => (x.deck === c.deck || $('deck').value === 'all') && known[x.id]).length;
  stage.innerHTML = `
    <button class="card${flipped ? ' show-answer' : ''}" id="card" type="button" aria-live="polite"
      aria-label="${flipped ? 'Answer shown. Activate to show question only' : 'Activate to reveal answer'}">
      <div class="side">${flipped ? 'Answer' : 'Question'}${known[c.id] ? ' · ✓ known' : ''}</div>
      <p class="q">${fmt(c.q)}</p>
      ${flipped ? `<div class="a">${fmt(c.a)}</div>` : ''}
    </button>
    <div class="meta">
      <span>Card ${pos + 1} of ${order.length}${$('hideKnown').checked ? ` (${total} not yet known)` : ` · ${knownCount} known`}</span>
      <a href="${c.deck.notes}">${c.deck.topic} · ${c.deck.title}</a>
    </div>
    <div class="controls">
      <button type="button" id="prev">← Prev</button>
      <button type="button" class="again" id="again">Again</button>
      <button type="button" class="primary" id="flip">${flipped ? 'Hide' : 'Flip'}</button>
      <button type="button" class="good" id="good">Got it ✓</button>
      <button type="button" id="next">Next →</button>
    </div>`;
  $('card').onclick = flip; $('flip').onclick = flip;
  $('prev').onclick = () => move(-1); $('next').onclick = () => move(1);
  $('again').onclick = () => mark(false); $('good').onclick = () => mark(true);
}

function flip() {
  const card = $('card');
  if (!card || matchMedia('(prefers-reduced-motion: reduce)').matches) { flipped = !flipped; render(); return; }
  card.classList.add('flipping');
  setTimeout(() => { flipped = !flipped; render(); $('card').focus(); }, 180);
}
function move(d) { if (!order.length) return; pos = (pos + d + order.length) % order.length; flipped = false; render(); }
function mark(ok) {
  if (!order.length) return;
  const c = order[pos];
  if (ok) known[c.id] = true; else delete known[c.id];
  store.set(known);
  if (ok && $('hideKnown').checked) { order.splice(pos, 1); if (pos >= order.length) pos = 0; flipped = false; render(); }
  else move(1);
}

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT' || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === ' ' && e.target.tagName === 'BUTTON' && e.target.id !== 'card') return;
  if (e.key === ' ' || (e.key === 'Enter' && e.target.id !== 'card' && e.target.tagName !== 'BUTTON')) { e.preventDefault(); flip(); }
  else if (e.key === 'ArrowRight') move(1);
  else if (e.key === 'ArrowLeft') move(-1);
  else if (e.key === '1') mark(false);
  else if (e.key === '2') mark(true);
});

(async () => {
  for (const f of DECK_FILES) await load(f);
  const sel = $('deck');
  sel.innerHTML = `<option value="all">All decks (${allCards().length} cards)</option>` +
    [...new Set(DECKS.map((d) => d.topic))].map((t) =>
      `<optgroup label="${t}">` + DECKS.filter((d) => d.topic === t)
        .map((d) => `<option value="${d.notes}">${d.title} (${d.cards.length})</option>`).join('') + '</optgroup>'
    ).join('');
  sel.onchange = rebuild;
  $('hideKnown').onchange = rebuild;
  $('shuffle').onclick = () => { shuffled = !shuffled; $('shuffle').setAttribute('aria-pressed', shuffled); $('shuffle').textContent = shuffled ? 'Shuffled ✓' : 'Shuffle'; rebuild(); };
  $('reset').onclick = () => { if (confirm('Clear all “known” marks?')) { known = {}; store.set(known); rebuild(); } };
  rebuild();
})();
</script>
</body>
</html>
